[package]
name = "git-state-widget"
version = "0.2.0"
description = "Desktop widget that answers one question at a glance: is any of my git work sitting in exactly one place?"
authors = ["claudecraft"]
edition = "2021"

[lib]
name = "git_state_widget_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "time", "macros", "rt-multi-thread", "sync"] }
futures = "0.3"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
