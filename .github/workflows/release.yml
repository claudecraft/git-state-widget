# Builds installers for Windows and macOS when a v* tag is pushed, and attaches them to a
# draft GitHub Release for review before publishing.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# Windows: NSIS per-user installer. macOS: .app + .dmg per chip, unsigned (right-click, Open on
# first launch). Signing and notarisation are a later step; see Artifact Viewer's mac/RELEASING.md.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles app,dmg
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles app,dmg
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: --bundles nsis

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Git State Widget ${{ github.ref_name }}"
          releaseBody: |
            **Windows:** run the `.exe` installer. Per-user, no admin rights needed.
            **macOS:** open the `.dmg` for your chip (`aarch64` for Apple silicon, `x64` for Intel). The app is unsigned, so right-click → Open the first time.

            Repos are configured from the tray menu after first launch.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
